<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI Platform Console</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>

    <style>

        *{margin:0;padding:0;box-sizing:border-box}

        body{
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
            background:#f4f6fb;
            height:100vh;
            overflow:hidden;
        }

        .layout{
            display:flex;
            height:100vh;
        }

        /* CHAT */

        .chat{
            flex:1;
            display:flex;
            flex-direction:column;
            background:white;
        }

        /* SIDEBAR */

        .sidebar{
            width:420px;
            background:#f9fafc;
            border-left:1px solid #eee;
            display:flex;
            flex-direction:column;
            height:100vh;
            overflow:hidden;
        }

        /* HEADER */

        .header{
            padding:14px 18px;
            border-bottom:1px solid #eee;
            display:flex;
            justify-content:space-between;
            align-items:center;
            background:white;
        }

        .controls{
            display:flex;
            gap:6px;
            align-items:center;
        }

        .controls select,
        .controls input{
            padding:6px 10px;
            border-radius:6px;
            border:1px solid #ddd;
            font-size:12px;
        }

        button{
            background:#4f46e5;
            color:white;
            border:none;
            padding:6px 12px;
            border-radius:6px;
            cursor:pointer;
        }

        /* MESSAGES */

        .messages{
            flex:1;
            overflow-y:auto;
            padding:20px;
            background:#fafbff;
        }

        .message{
            display:flex;
            margin-bottom:14px;
        }

        .message.user{
            justify-content:flex-end;
        }

        .bubble{
            max-width:70%;
            padding:12px 14px;
            border-radius:12px;
            font-size:14px;
            line-height:1.6;
            box-shadow:0 2px 8px rgba(0,0,0,0.05);
        }

        .message.user .bubble{
            background:#4f46e5;
            color:white;
        }

        .message.ai .bubble{
            background:white;
            border:1px solid #eee;
        }

        /* INPUT */

        .input{
            border-top:1px solid #eee;
            padding:14px;
            display:flex;
            gap:10px;
        }

        textarea{
            flex:1;
            border:1px solid #ddd;
            border-radius:8px;
            padding:10px;
            resize:none;
        }

        /* SIDEBAR SECTIONS */

        .section{
            padding:14px;
            border-bottom:1px solid #eee;
            flex-shrink:0;
            max-height:180px;
            overflow:auto;
        }

        .section h3{
            font-size:13px;
            margin-bottom:8px;
        }

        /* EDITOR */

        .editor{
            width:100%;
            height:120px;
            font-family:monospace;
            font-size:12px;
            border:1px solid #ddd;
            border-radius:6px;
            padding:8px;
            resize:vertical;
            overflow:auto;
        }

        /* CURL */

        .curl{
            background:#111827;
            color:#22c55e;
            padding:8px;
            border-radius:6px;
            font-size:12px;
            overflow:auto;
            max-height:120px;
            white-space:pre-wrap;
            word-break:break-all;
        }

        /* LOGS */

        .logs{
            flex:1;
            overflow-y:auto;
            background:#0f172a;
            color:#e5e7eb;
            font-family:monospace;
            padding:10px;
            font-size:12px;
        }

        .log{
            margin-bottom:10px;
            padding-bottom:8px;
            border-bottom:1px solid #1f2937;
        }

        .log-url{color:#22c55e}
        .log-time{color:#9ca3af}

        .typing{
            font-size:12px;
            color:#888;
            padding:6px;
        }

    </style>
</head>

<body>

<div id="app">

    <div class="layout">

        <div class="chat">

            <div class="header">

                <h3>🤖 AI Platform Console</h3>

                <div class="controls">

                    <select v-model="platform" @change="loadModels">
                        <option v-for="p in platforms" :value="p.name">
                            {{p.displayName}}
                        </option>
                    </select>

                    <select v-model="model">
                        <option v-for="m in models" :value="m.name">
                            {{m.displayName}}
                        </option>
                    </select>

                    <select v-model="mode">
                        <option value="stream">stream</option>
                        <option value="call">call</option>
                    </select>

                    <input v-model="userId" placeholder="user">
                    <input v-model="sessionId" placeholder="session">

                    <button @click="clearChat">new</button>

                </div>
            </div>

            <div class="messages" ref="messages">

                <div v-for="m in messages" :class="['message',m.role]">
                    <div class="bubble" v-html="render(m.content)"></div>
                </div>

                <div v-if="typing" class="typing">AI thinking...</div>

            </div>

            <div class="input">

<textarea rows="2"
          v-model="input"
          @keyup.enter.exact="send"
          placeholder="Type message"></textarea>

                <button @click="send">Send</button>

            </div>

        </div>

        <div class="sidebar">

            <div class="section">
                <h3>Prompt</h3>
                <textarea class="editor" v-model="prompt"></textarea>
            </div>

            <div class="section">
                <h3>Request JSON</h3>
                <textarea class="editor" v-model="json"></textarea>
            </div>

            <div class="section">
                <h3>Curl</h3>
                <div class="curl">{{curl}}</div>
            </div>

            <div class="section">
                <h3>Stats</h3>
                <div>Latency: {{latency}} ms</div>
            </div>

            <div class="logs">

                <div v-for="l in logs" class="log">

                    <div class="log-time">{{l.time}}</div>
                    <div class="log-url">{{l.url}}</div>
                    <div>{{l.query}}</div>

                    <button @click="replay(l)">replay</button>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

    const {createApp}=Vue

    createApp({

        data(){

            return{

                platforms:[],
                models:[],

                platform:"",
                model:"",

                mode:"stream",

                messages:[],
                input:"",

                prompt:"You are a helpful assistant.",

                json:`{
"temperature":0.7,
"maxTokens":2000
}`,

                typing:false,

                userId:"anonymous",
                sessionId:"",

                latency:0,

                logs:[]

            }

        },

        computed:{

            requestBody(){

                return {
                    query:this.input,
                    prompt:this.prompt,
                    platform:this.platform,
                    modelName:this.model,
                    userId:this.userId,
                    sessionId:this.sessionId,
                    temperature:0.7,
                    maxTokens:2000
                }

            },

            curl(){

                let body=this.requestBody

                return `curl -X POST http://localhost:8080/chat/${this.mode} -H "Content-Type: application/json" -d '${JSON.stringify(body,null,2)}'`

            }

        },

        mounted(){

            this.loadPlatforms()

            this.updateJsonFromRequest()

        },

        methods:{

            render(t){

                let html=marked.parse(t||"")

                this.$nextTick(()=>{
                    document.querySelectorAll("pre code").forEach((el)=>{
                        hljs.highlightElement(el)
                    })
                })

                return html
            },

            scroll(){

                this.$nextTick(()=>{
                    let e=this.$refs.messages
                    e.scrollTop=e.scrollHeight
                })

            },

            clearChat(){
                this.messages=[]
            },

            log(url,query){

                this.logs.unshift({
                    time:new Date().toLocaleTimeString(),
                    url,
                    query
                })

            },

            replay(l){
                this.input=l.query
            },

            async loadPlatforms(){

                let r=await fetch("/chat/platforms")
                let data=await r.json()

                this.platforms=data

                if(data.length>0){
                    this.platform=data[0].name
                    this.loadModels()
                }

                this.updateJsonFromRequest()

            },

            async loadModels(){

                if(!this.platform)return

                let r=await fetch(`/chat/platforms/${this.platform}/models`)
                let data=await r.json()

                this.models=data

                if(data.length>0){
                    this.model=data[0].name
                }

                this.updateJsonFromRequest()

            },

            updateJsonFromRequest(){

                this.json=JSON.stringify(this.requestBody,null,2)

            },

            async send(){

                if(!this.input.trim())return

                let query=this.input

                this.messages.push({role:"user",content:query})

                this.input=""

                this.typing=true

                this.scroll()

                let body=this.requestBody

                let start=Date.now()

                try{

                    if(this.mode==="stream"){

                        let r=await fetch("/chat/stream",{

                            method:"POST",

                            headers:{
                                "Content-Type":"application/json"
                            },

                            body:JSON.stringify(body)

                        })

                        let reader=r.body.getReader()

                        let decoder=new TextDecoder()

                        let ai=""

                        this.messages.push({role:"ai",content:""})

                        let idx=this.messages.length-1

                        while(true){

                            let {done,value}=await reader.read()

                            if(done)break

                            ai+=decoder.decode(value,{stream:true})

                            this.messages[idx].content=ai

                            this.scroll()

                        }

                    }else{

                        let r=await fetch("/chat",{

                            method:"POST",

                            headers:{"Content-Type":"application/json"},

                            body:JSON.stringify(body)

                        })

                        let j=await r.json()

                        this.messages.push({
                            role:"ai",
                            content:j.result
                        })

                    }

                }catch(e){

                    this.messages.push({
                        role:"ai",
                        content:"❌ "+e
                    })

                }

                this.latency=Date.now()-start

                this.typing=false

                this.log("/chat",query)

                this.scroll()

            }

        }

    }).mount("#app")

</script>

</body>
</html>
