<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Console</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>

    <style>

        *{margin:0;padding:0;box-sizing:border-box}

        body{
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
            background:#f4f6fb;
            height:100vh;
            overflow:hidden;
        }

        .container{
            display:flex;
            height:100vh;
        }

        /* chat */

        .chat-area{
            flex:1;
            display:flex;
            flex-direction:column;
            background:white;
        }

        .header{
            padding:18px 30px;
            border-bottom:1px solid #eee;
            background:#fff;
        }

        .settings{
            display:flex;
            gap:12px;
            padding:15px 30px;
            border-bottom:1px solid #eee;
            background:#fafafa;
        }

        .form-control{
            padding:8px 12px;
            border-radius:8px;
            border:1px solid #ddd;
            font-size:13px;
        }

        .messages{
            flex:1;
            overflow-y:auto;
            padding:30px;
            background:#fafbfc;
        }

        .message{
            display:flex;
            margin-bottom:18px;
        }

        .message.user{
            justify-content:flex-end;
        }

        .message-content{
            max-width:65%;
            padding:14px 18px;
            border-radius:14px;
            line-height:1.7;
            font-size:14px;
            box-shadow:0 2px 8px rgba(0,0,0,0.05);
        }

        .message.user .message-content{
            background:#6366f1;
            color:white;
        }

        .message.ai .message-content{
            background:white;
            border:1px solid #eee;
        }

        .input-area{
            border-top:1px solid #eee;
            padding:20px;
            display:flex;
            gap:10px;
            background:white;
        }

        textarea{
            flex:1;
            border:1px solid #ddd;
            border-radius:10px;
            padding:12px;
            font-size:14px;
            resize:none;
        }

        button{
            background:#6366f1;
            border:none;
            color:white;
            padding:10px 18px;
            border-radius:8px;
            cursor:pointer;
        }

        button.secondary{
            background:#aaa;
        }

        /* sidebar */

        .sidebar{
            width:360px;
            background:#fbfbfd;
            border-left:1px solid #eee;
            display:flex;
            flex-direction:column;
        }

        .param-section{
            padding:16px;
            border-bottom:1px solid #eee;
        }

        .param-item{
            background:white;
            border-radius:8px;
            padding:10px;
            margin-bottom:10px;
            border:1px solid #eee;
        }

        .param-label{
            font-size:11px;
            color:#888;
            margin-bottom:4px;
        }

        .param-value{
            font-size:13px;
        }

        .param-item input,
        .param-item select{
            width:100%;
            padding:6px;
            border-radius:6px;
            border:1px solid #ddd;
            font-size:12px;
            margin-top:4px;
        }

        .logs{
            flex:1;
            overflow-y:auto;
            padding:12px;
            background:#111827;
            color:white;
            font-family:monospace;
        }

        .log-item{
            margin-bottom:12px;
            padding-bottom:12px;
            border-bottom:1px solid #333;
        }

        .log-url{
            color:#22c55e;
        }

        .log-time{
            color:#9ca3af;
            font-size:12px;
        }

        .typing{
            font-size:13px;
            color:#888;
        }

    </style>
</head>

<body>

<div id="app">

    <div class="container">

        <!-- Chat -->

        <div class="chat-area">

            <div class="header">
                <h1>🤖 AI 智能对话</h1>
                <div style="font-size:12px;color:#777">
                    Platform: {{selectedPlatform}} | Model: {{selectedModel}}
                </div>
            </div>

            <div class="settings">

                <select v-model="selectedPlatform" @change="loadModels" class="form-control">
                    <option v-for="p in platforms" :value="p.name">
                        {{p.displayName}}
                    </option>
                </select>

                <select v-model="selectedModel" class="form-control">
                    <option v-for="m in models" :value="m.name">
                        {{m.displayName}}
                    </option>
                </select>

                <select v-model="mode" class="form-control">
                    <option value="stream">流式</option>
                    <option value="call">普通</option>
                </select>

                <button class="secondary" @click="clearChat">新会话</button>

            </div>

            <div class="messages" ref="messages">

                <div v-for="(m,i) in messages" :key="i" :class="['message',m.role]">
                    <div class="message-content" v-html="renderMarkdown(m.content)"></div>
                </div>

                <div v-if="typing" class="typing">AI 正在思考...</div>

            </div>

            <div class="input-area">

<textarea
        v-model="input"
        rows="2"
        placeholder="输入消息..."
        @keyup.enter.exact="send"
></textarea>

                <button @click="send">发送</button>

            </div>

        </div>

        <!-- Sidebar -->

        <div class="sidebar">

            <div class="param-section">

                <h3 style="margin-bottom:10px">请求参数</h3>

                <div class="param-item">
                    <div class="param-label">query</div>
                    <div class="param-value">{{current.query}}</div>
                </div>

                <div class="param-item">
                    <div class="param-label">platform</div>
                    <div class="param-value">{{current.platform}}</div>
                </div>

                <div class="param-item">
                    <div class="param-label">model</div>
                    <div class="param-value">{{current.model}}</div>
                </div>

                <div class="param-item">

                    <div class="param-label">sessionId</div>

                    <input v-model="sessionId" placeholder="输入 sessionId">

                    <select v-model="sessionId">
                        <option value="">自动生成</option>
                        <option v-for="s in defaultSessions" :value="s">{{s}}</option>
                    </select>

                </div>

                <div class="param-item">

                    <div class="param-label">userId</div>

                    <input v-model="userId" placeholder="输入 userId">

                    <select v-model="userId">
                        <option v-for="u in defaultUserIds" :value="u">{{u}}</option>
                    </select>

                </div>

            </div>

            <div class="logs">

                <div v-for="l in logs" class="log-item">

                    <div class="log-time">{{l.time}}</div>

                    <div class="log-url">{{l.url}}</div>

                    <div>query: {{l.query}}</div>
                    <div>userId: {{l.userId}}</div>
                    <div v-if="l.sessionId">sessionId: {{l.sessionId}}</div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

    const {createApp}=Vue

    createApp({

        data(){
            return{

                platforms:[],
                models:[],

                selectedPlatform:"SILICON_FLOW",
                selectedModel:"",

                mode:"stream",

                messages:[],
                input:"",

                typing:false,

                sessionId:"",
                userId:"anonymous",

                defaultUserIds:[
                    "anonymous",
                    "user_1",
                    "user_2",
                    "admin"
                ],

                defaultSessions:[
                    "session_demo",
                    "session_test",
                    "session_001"
                ],

                current:{},
                logs:[]
            }
        },

        mounted(){
            this.loadPlatforms()
        },

        methods:{

            renderMarkdown(t){
                return marked.parse(t||"")
            },

            scroll(){

                this.$nextTick(()=>{
                    let el=this.$refs.messages
                    el.scrollTop=el.scrollHeight
                })

            },

            clearChat(){
                this.messages=[]
                this.sessionId=""
            },

            async loadPlatforms(){

                let r=await fetch("/chat/platforms")
                this.platforms=await r.json()

                if(this.platforms.length)
                    this.loadModels()

            },

            async loadModels(){

                let r=await fetch(`/chat/platforms/${this.selectedPlatform}/models`)
                this.models=await r.json()

                if(this.models.length)
                    this.selectedModel=this.models[0].name

            },

            log(url,query){

                this.logs.unshift({

                    time:new Date().toLocaleTimeString(),

                    url,
                    query,
                    userId:this.userId,
                    sessionId:this.sessionId

                })

            },

            async send(){

                if(!this.input.trim())return

                let query=this.input

                this.messages.push({role:"user",content:query})

                this.input=""

                this.typing=true

                this.scroll()

                let params=new URLSearchParams({

                    query,
                    platform:this.selectedPlatform,
                    modelName:this.selectedModel,
                    userId:this.userId

                })

                if(this.sessionId)
                    params.append("sessionId",this.sessionId)

                this.current={
                    query,
                    platform:this.selectedPlatform,
                    model:this.selectedModel
                }

                this.log("/chat",query)

                if(this.mode==="stream"){

                    let r=await fetch(`/chat/stream?${params}`)

                    let reader=r.body.getReader()

                    let decoder=new TextDecoder()

                    let ai=""

                    this.messages.push({role:"ai",content:""})

                    let idx=this.messages.length-1

                    while(true){

                        let {done,value}=await reader.read()

                        if(done)break

                        ai+=decoder.decode(value)

                        this.messages[idx].content=ai

                        this.scroll()

                    }

                }else{

                    let r=await fetch(`/chat?${params}`)

                    let j=await r.json()

                    this.messages.push({role:"ai",content:j.result})

                }

                this.typing=false

                if(!this.sessionId)
                    this.sessionId="session_"+Date.now()

                this.scroll()

            }

        }

    }).mount("#app")

</script>

</body>
</html>
