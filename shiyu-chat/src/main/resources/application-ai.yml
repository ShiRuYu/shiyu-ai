spring:
  ai:
    # 没有作用，是接入多个兼容 openai api 的平台
    openai:
      api-key: xxxxxxxxxxxxxx
# 大模型配置
shiyu:
  # 记忆功能配置
  memory:
    enabled: true                    # 是否启用记忆功能
    max-short-term-memories: 10      # 短期记忆最大数量
    max-long-term-memories: 50       # 长期记忆最大数量
    max-history-records: 5           # 对话历史最大保留数
    short-term-expire-hours: 24      # 短期记忆过期时间（小时）
    auto-extract-long-term: true     # 是否自动提取长期记忆
  # 意图识别配置
  intent:
    categories:
      default:
        - id: "direct_greeting"
          name: "问候寒暄"
          type: "DIRECT"
          content: "用于处理日常问候、寒暄等简单对话"
          keywords: ["你好", "您好", "hello", "hi", "早上好", "下午好", "晚上好"]
          chain-to-call: "chatDirect"
        
        - id: "cot_reasoning"
          name: "逻辑推理"
          type: "COT"
          content: "需要逐步推理的问题，如数学题、逻辑题等"
          keywords: ["为什么", "如何证明", "推理", "计算", "数学", "逻辑"]
          chain-to-call: "chatCoT"
        
        - id: "tot_decision"
          name: "多方案决策"
          type: "TOT"
          content: "需要从多个角度分析并提供多种解决方案的问题"
          keywords: ["方案", "选择", "决策", "对比", "优缺点", "哪个更好"]
          chain-to-call: "chatToT"

