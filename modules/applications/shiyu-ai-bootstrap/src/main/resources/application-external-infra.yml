spring:
  config:
    activate:
      on-profile: external-infra

shiyu:
  infrastructure:
    database:
      provider: ${SHIYU_INFRA_DATABASE_PROVIDER:postgresql}
  storage:
    type: ${SHIYU_STORAGE_TYPE:local}
  vector-store:
    type: ${SHIYU_VECTOR_STORE_TYPE:jvector}

mybatis-flex:
  datasource:
    agent:
      type: com.zaxxer.hikari.HikariDataSource
      driver-class-name: ${SHIYU_DB_DRIVER:org.postgresql.Driver}
      url: ${SHIYU_DB_URL:}
      username: ${SHIYU_DB_USERNAME:}
      password: ${SHIYU_DB_PASSWORD:}
      validation-query: SELECT 1
