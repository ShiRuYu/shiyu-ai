spring:
  config:
    activate:
      on-profile: postgresql

shiyu:
  infrastructure:
    database:
      provider: postgresql

mybatis-flex:
  datasource:
    agent:
      type: com.zaxxer.hikari.HikariDataSource
      driver-class-name: org.postgresql.Driver
      url: ${SHIYU_DB_URL:jdbc:postgresql://127.0.0.1:5432/shiyu}
      username: ${SHIYU_DB_USERNAME:shiyu}
      password: ${SHIYU_DB_PASSWORD:}
      validation-query: SELECT 1
