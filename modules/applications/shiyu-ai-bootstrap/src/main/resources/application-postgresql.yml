spring:
  config:
    activate:
      on-profile: postgresql

shiyu:
  infrastructure:
    database:
      provider: postgresql
  storage:
    backup:
      enabled: false

mybatis-flex:
  datasource:
    agent:
      type: com.zaxxer.hikari.HikariDataSource
      driver-class-name: org.postgresql.Driver
      url: ${SHIYU_DB_URL:jdbc:postgresql://localhost:5433/postgres}
      username: ${SHIYU_DB_USERNAME:postgres}
      password: ${SHIYU_DB_PASSWORD:FjEdY+0ShHBJNTHuNl5cyQVmWlG23vaC}
      validation-query: SELECT 1
