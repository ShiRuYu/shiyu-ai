spring:
  config:
    activate:
      on-profile: postgresql

shiyu:
  infrastructure:
    database:
      provider: postgresql

mybatis-flex:
  datasource:
    agent:
      type: com.zaxxer.hikari.HikariDataSource
      driver-class-name: org.postgresql.Driver
      url: ${SHIYU_DB_URL:}
      username: ${SHIYU_DB_USERNAME:}
      password: ${SHIYU_DB_PASSWORD:}
      validation-query: SELECT 1
