spring:
  config:
    activate:
      on-profile: mysql

shiyu:
  infrastructure:
    database:
      provider: mysql

mybatis-flex:
  datasource:
    agent:
      type: com.zaxxer.hikari.HikariDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: ${SHIYU_DB_URL:}
      username: ${SHIYU_DB_USERNAME:}
      password: ${SHIYU_DB_PASSWORD:}
      validation-query: SELECT 1
