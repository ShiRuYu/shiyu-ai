name: 后端质量门禁

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - 'releases/*'

permissions:
  contents: read

env:
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 编译并测试全部模块
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: shiyu-ai
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: shiyu-ai

      - name: 检出前端契约与文档
        uses: actions/checkout@v4
        with:
          repository: ShiRuYu/shiyu-ui
          ref: ${{ vars.SHIYU_UI_REF || 'main' }}
          token: ${{ secrets.CONTRACTS_READ_TOKEN || github.token }}
          path: shiyu-ui
          persist-credentials: false

      - name: 设置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 验证 Docker 外部设施
        run: |
          docker version
          docker info

      - name: 预检依赖清单路径
        run: |
          mvn --batch-mode --no-transfer-progress -pl modules/domains/agent/shiyu-agent-implementation -am dependency:go-offline -DskipTests -Ddependency-check.skip=true
          python scripts/architecture/check_dependency_manifests.py --allow-missing slf4j-api-2.0.17.jar "$HOME/.m2/repository/org/apache/opennlp/opennlp-tools/2.5.9/opennlp-tools-2.5.9.jar"

      - name: 运行 Maven 编译、架构和测试门禁
        run: mvn --batch-mode --no-transfer-progress -Pstrict-warnings verify -Ddependency-check.skip=true

      - name: 验证包归属清单和边界夹具
        run: |
          python -m unittest discover -s scripts/architecture/tests -p 'test_*.py'
          python scripts/architecture/check_functional_javadocs.py modules --include-tests --baseline scripts/architecture/functional-javadoc-baseline.json --report docs/工程功能注释整改清单.md
          git diff --exit-code -- docs/工程功能注释整改清单.md
          python scripts/architecture/check_type_javadocs.py modules --include-tests
          python scripts/architecture/check_chinese_comments.py pom.xml modules tests scripts .github docs
          python scripts/architecture/check_interface_javadocs.py modules
          python scripts/architecture/inventory_java_packages.py --output scripts/architecture/package-migration.csv
          git diff --exit-code -- scripts/architecture/package-migration.csv

      - name: 验证打包应用使用全新 APP_HOME 启动
        run: python scripts/verify_fresh_startup.py --openapi-snapshot ../shiyu-ui/tests/contracts/shiyu-ai-openapi.json

      - name: 执行领域 JaCoCo 阈值
        run: python scripts/architecture/check_domain_coverage.py

      - name: 验证生成文档和路由清单
        run: python scripts/docs/verify_documentation.py --frontend-root ../shiyu-ui

      - name: 检查全部模块，禁止旧版 /v1 控制器路由回归（非 REST 风格检查）
        run: python scripts/architecture/check_legacy_routes.py

      - name: 拒绝已废弃的 Workspace 后端标识
        run: python scripts/architecture/check_backend_terminology.py

      - name: 执行仅契约领域依赖规则
        run: python scripts/architecture/check_domain_module_dependencies.py

      - name: 执行领域数据库模式归属规则
        run: python scripts/architecture/check_schema_ownership.py

      - name: 执行后端模块命名一致性规则
        run: python scripts/architecture/check_backend_module_names.py

  dependency-scan:
    name: OWASP NVD 依赖漏洞扫描
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: shiyu-ai
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: shiyu-ai

      - name: 设置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 缓存 OWASP NVD 数据
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-owasp-nvd-data-v1
          restore-keys: |
            ${{ runner.os }}-owasp-nvd-data-

      - name: 校验 NVD API 密钥
        run: |
          test -n "$NVD_API_KEY" || {
            echo 'NVD_API_KEY secret is required for the dependency scan.' >&2
            exit 1
          }

      - name: 执行聚合 NVD 依赖扫描
        run: >-
          mvn --batch-mode --no-transfer-progress
          -DskipTests
          -Ddependency-check.skip=false
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
          -DnvdValidForHours=24
          org.owasp:dependency-check-maven:11.1.1:aggregate
