spring:
  h2:
    console:
      enabled: true
      path: /h2
      settings:
        web-allow-others: false

mybatis-flex:
  datasource:
    agent:
      type: druid
      driverClassName: org.h2.Driver
      url: jdbc:h2:file:${app.home}/data/db/shiyudb;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=FALSE
      username: sa
      password:
      validationQuery: SELECT 1
