shiyu:
  # 名称
  name: "shiyu-agent"
  # 版本
  version: ${revision}
# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 9000

springdoc:
  api-docs:
    enabled: true               # 是否启用 API 文档
    path: /v3/api-docs         # OpenAPI JSON 文档访问路径，默认 /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match:
        - '/**'
      packages-to-scan:
        - com.shiyu.ai.agent.biz.**.controller
    - group: 'common'
      paths-to-match:
        - '/**'
      packages-to-scan:
        - com.shiyu.ai.agent.biz.common.controller
    - group: 'auth'
      paths-to-match:
        - '/**'
      packages-to-scan:
        - com.shiyu.ai.agent.biz.auth.controller
    - group: 'record'
      paths-to-match:
        - '/**'
      packages-to-scan:
        - com.shiyu.ai.agent.biz.record.controller
    - group: 'agent'
      paths-to-match:
        - '/**'
      packages-to-scan:
        - com.shiyu.ai.agent.biz.agent.controller
  swagger-ui:
    path: /swagger-ui/index.html      # Swagger UI 访问路径，默认 /swagger-ui/index.html
    display-request-duration: true  # 显示请求耗时
    operations-sorter: alpha     # 按字母排序接口
    tags-sorter: alpha           # 按标签排序
    default-model-rendering: example # 默认显示 model 示例

# Spring 配置
spring:
  application:
    name: ${shiyu.name}
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: @profiles.active@
    group:
      dev: ai, h2 #,mcp
