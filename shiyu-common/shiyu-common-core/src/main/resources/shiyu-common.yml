management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus  # 只暴露必要的端点
  endpoint:
    health:
      show-details: when-authorized # 仅授权用户可见详细信息
    metrics:
      enabled: true
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
  otlp:
    metrics:
      export:
        enabled:
          false
  observations:
    key-values:
      application: shiyu-ai