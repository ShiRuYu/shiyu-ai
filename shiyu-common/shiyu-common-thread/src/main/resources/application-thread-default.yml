# 线程模块默认配置
spring:
  application:
    name: shiyu-common-thread

# 线程配置
shiyu:
  thread:
    # 是否启用指标收集
    metrics-enabled: false

    # 是否启用OpenTelemetry集成
    otel-enabled: false

    # 默认线程池配置
    default-pool:
      # 线程池类型
      type: DEFAULT
      # 核心线程数，默认为CPU核心数
      core-size: ${JAVA_CORE_COUNT:4}
      # 最大线程数，默认为CPU核心数*4
      max-size: ${JAVA_MAX_THREADS:16}
      # 线程空闲时间(秒)
      keep-alive-time: 60
      # 队列容量
      queue-capacity: 1000
      # 拒绝策略
      rejection-policy: CALLER_RUNS
      # 是否允许核心线程超时
      allow-core-thread-time-out: true
      # 线程名称前缀
      thread-name-prefix: shiyu-default

    # 命名线程池配置
    pools:
      # Knowledge document parsing/embedding worker. Keep this bounded because
      # each task can hold a complete source document and parsed text in memory.
      knowledge-ingestion:
        type: IO_INTENSIVE
        core-size: ${shiyu.knowledge.task.parse-concurrency:2}
        max-size: ${shiyu.knowledge.task.parse-concurrency:2}
        queue-capacity: 100
        keep-alive-time: 60
        rejection-policy: CALLER_RUNS
        allow-core-thread-time-out: false
        thread-name-prefix: knowledge-ingest

      # 异步任务线程池
      async:
        core-size: ${JAVA_CORE_COUNT:4}
        max-size: ${JAVA_MAX_THREADS:16}
        queue-capacity: 1000
        thread-name-prefix: shiyu-async

      # 定时任务线程池
      scheduled:
        core-size: ${JAVA_CORE_COUNT:4}
        max-size: ${JAVA_MAX_THREADS:16}
        thread-name-prefix: shiyu-scheduled

      # IO密集型任务线程池
      io:
        core-size: ${JAVA_CORE_COUNT:8}
        max-size: ${JAVA_MAX_THREADS:32}
        queue-capacity: 2000
        thread-name-prefix: shiyu-io

      # CPU密集型任务线程池
      cpu:
        core-size: ${JAVA_CORE_COUNT:4}
        max-size: ${JAVA_CORE_COUNT:4}
        queue-capacity: 500
        thread-name-prefix: shiyu-cpu
