server:
  port: 9003

# Logging levels (package hierarchy)
logging:
  level:
    # Project packages - use Maven profile level
    root: warn
    com.shiyu: @logging.level@
    # Third-party frameworks - fixed levels
    org.springframework: warn
    org.springframework.ai: warn
    org.mybatis: warn
    org.apache: error
    com.zaxxer: error
    springfox.documentation: error
    org.hibernate: error
spring:
  application:
    name: shiyu-mcp
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: shiyu-mcp-serve
        version: 1.0.0